name: Deploys nodejs application main branch

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name : Deploy via ssh
        uses : appleboy/ssh-action@v1.0.3
        with : 
          host : ${{secrets.SSH_HOST}}
          user : root
          key : ${{secrets.SSH_KEY}}
          script: |
            cd /home/ubuntu/data/nodejs-deploy-github-actions
            git pull
            docker compose up -d --build\